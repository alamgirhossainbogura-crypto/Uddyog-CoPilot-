name: Uddyog-CoPilot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Auto-Detect & Build
        run: |
          if [ -f "./frontend/package.json" ]; then
            echo "Found frontend directory!"
            cd frontend
            npm install --legacy-peer-deps
            npm run build --if-present
          elif [ -f "./package.json" ]; then
            echo "Found root package.json!"
            npm install --legacy-peer-deps
            npm run build --if-present
          else
            echo "Error: No package.json found in root or frontend directory"
            exit 1
          fi
